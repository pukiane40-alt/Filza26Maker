name: Patch Filza IPA (Fix Apps Manager)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid

      - name: Extract IPA
        run: |
          mkdir -p work
          cp "Filza-Jailed-iOS26-Premium.ipa" work/Filza.zip
          cd work && unzip -q Filza.zip
          echo "Extracted: $(ls Payload/)"

      - name: Remove FilzaApplySandboxExt.dylib (iOS 26 crash fix)
        run: |
          DYLIB="work/Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib"
          BINARY="work/Payload/Filza.app/Filza"

          echo "== Checking dylib links in main binary =="
          otool -L "$BINARY" | grep -i "sandbox\|iosnhatt\|libtele" || true

          echo "== Removing FilzaApplySandboxExt.dylib =="
          rm -f "$DYLIB"
          echo "Removed: FilzaApplySandboxExt.dylib"

          echo "== Patching binary: remove LC_LOAD_DYLIB reference =="
          install_name_tool -delete_rpath "@executable_path/Frameworks" "$BINARY" 2>/dev/null || true

          # Remove hard link to the problematic dylib
          SANDBOXREF=$(otool -L "$BINARY" | grep -i "FilzaApplySandboxExt" | awk '{print $1}' || true)
          if [ -n "$SANDBOXREF" ]; then
            echo "Removing reference: $SANDBOXREF"
            install_name_tool -change "$SANDBOXREF" "/usr/lib/libSystem.B.dylib" "$BINARY" 2>/dev/null || true
          fi

          echo "== Dylib links after patch =="
          otool -L "$BINARY" | head -20

      - name: Write entitlements
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
            <key>com.apple.private.MobileInstallation.AllowAllBundles</key>
            <true/>
            <key>com.apple.springboard.launchapplications</key>
            <true/>
            <key>get-task-allow</key>
            <true/>
            <key>application-identifier</key>
            <string>*</string>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Patch binary with ldid
        run: |
          ldid -Sentitlements.plist "work/Payload/Filza.app/Filza"
          echo "ldid patch OK"

      - name: Remove old signature
        run: |
          rm -rf "work/Payload/Filza.app/_CodeSignature"
          rm -f  "work/Payload/Filza.app/embedded.mobileprovision"

      - name: Repack IPA
        run: |
          cd work && zip -qr ../Filza-iOS26-NoSandboxCrash.ipa Payload/
          cd ..
          echo "IPA: $(du -sh Filza-iOS26-NoSandboxCrash.ipa | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-iOS26-NoSandboxCrash
          path: Filza-iOS26-NoSandboxCrash.ipa
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nosandboxcrash-v4.0.1-${{ github.run_number }}"
          name: "Filza iOS 26 — No Crash Fix Build ${{ github.run_number }}"
          body: |
            ## Filza iOS 26 — Crash Fix

            ### Çfarë u rregullua
            - U hoq `FilzaApplySandboxExt.dylib` (shkaktonte crash në iOS 26.2.1)
            - U patch-ua binary kryesor me `install_name_tool`
            - Entitlements të plota (platform-application, no-sandbox)

            ### Instalim
            1. Shkarko `Filza-iOS26-NoSandboxCrash.ipa`
            2. Hap me **ESign** → sinjalo
            3. Instalo dhe hap Filza
          files: Filza-iOS26-NoSandboxCrash.ipa
