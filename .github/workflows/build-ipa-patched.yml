name: Patch Filza IPA (Fix Apps Manager)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid

      - name: Extract IPA
        run: |
          mkdir -p work
          cp "Filza-Jailed-iOS26-Premium.ipa" work/Filza.zip
          cd work && unzip -q Filza.zip
          echo "Extracted: $(ls Payload/)"

      - name: Inspect FilzaApplySandboxExt.dylib
        run: |
          DYLIB="work/Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib"
          echo "=== Dylib imports ==="
          otool -L "$DYLIB" || true
          echo "=== Exported symbols ==="
          nm -gU "$DYLIB" 2>/dev/null | head -20 || true

      - name: Patch main binary - make FilzaApplySandboxExt weak load
        run: |
          BINARY="work/Payload/Filza.app/Filza"
          echo "=== Current load commands for sandbox dylib ==="
          otool -L "$BINARY" | grep -i "sandbox\|Sandbox" || true

          python3 << 'PYEOF'
          import struct, sys, os

          binary_path = "work/Payload/Filza.app/Filza"
          target = b"FilzaApplySandboxExt"

          LC_LOAD_DYLIB      = 0x0000000C
          LC_LOAD_WEAK_DYLIB = 0x80000018

          with open(binary_path, "rb") as f:
              data = bytearray(f.read())

          patched = 0
          i = 0
          while i < len(data) - 8:
              # Find our target string
              idx = data.find(target, i)
              if idx == -1:
                  break
              # Scan backwards to find LC header (cmd + cmdsize)
              for back in range(idx, max(idx - 512, 0), -4):
                  try:
                      cmd = struct.unpack_from("<I", data, back)[0]
                      if cmd == LC_LOAD_DYLIB:
                          old = struct.pack("<I", LC_LOAD_DYLIB)
                          new = struct.pack("<I", LC_LOAD_WEAK_DYLIB)
                          data[back:back+4] = new
                          patched += 1
                          print(f"[+] Patched LC_LOAD_DYLIB -> LC_LOAD_WEAK_DYLIB at offset {back:#x}")
                          break
                  except:
                      pass
              i = idx + 1

          if patched == 0:
              print("[!] No LC_LOAD_DYLIB found for target — binary may be FAT or different arch")
              # Try FAT binary: scan all slices
              magic = struct.unpack_from(">I", data, 0)[0]
              if magic == 0xCAFEBABE:  # FAT
                  nfat = struct.unpack_from(">I", data, 4)[0]
                  for s in range(nfat):
                      off = struct.unpack_from(">I", data, 8 + s*20)[0]
                      sz  = struct.unpack_from(">I", data, 12 + s*20)[0]
                      slice_data = data[off:off+sz]
                      j = 0
                      while j < len(slice_data) - 8:
                          idx2 = slice_data.find(target, j)
                          if idx2 == -1:
                              break
                          for back2 in range(idx2, max(idx2 - 512, 0), -4):
                              try:
                                  cmd2 = struct.unpack_from("<I", slice_data, back2)[0]
                                  if cmd2 == LC_LOAD_DYLIB:
                                      new = struct.pack("<I", LC_LOAD_WEAK_DYLIB)
                                      data[off+back2:off+back2+4] = new
                                      patched += 1
                                      print(f"[+] FAT slice {s}: patched at {off+back2:#x}")
                                      break
                              except:
                                  pass
                          j = idx2 + 1

          with open(binary_path, "wb") as f:
              f.write(data)

          print(f"[=] Total patches: {patched}")
          PYEOF

          echo "=== After patch ==="
          otool -L "$BINARY" | grep -i "sandbox\|Sandbox" || true

      - name: Patch FilzaApplySandboxExt.dylib - make iosnhatt and libtelettt weak
        run: |
          DYLIB="work/Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib"

          python3 << 'PYEOF'
          import struct

          dylib_path = "work/Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib"
          targets = [b"iosnhatt", b"libtelettt"]

          LC_LOAD_DYLIB      = 0x0000000C
          LC_LOAD_WEAK_DYLIB = 0x80000018

          with open(dylib_path, "rb") as f:
              data = bytearray(f.read())

          patched = 0
          for target in targets:
              i = 0
              while i < len(data) - 8:
                  idx = data.find(target, i)
                  if idx == -1:
                      break
                  for back in range(idx, max(idx - 512, 0), -4):
                      try:
                          cmd = struct.unpack_from("<I", data, back)[0]
                          if cmd == LC_LOAD_DYLIB:
                              data[back:back+4] = struct.pack("<I", LC_LOAD_WEAK_DYLIB)
                              patched += 1
                              print(f"[+] {target.decode()}: patched at {back:#x}")
                              break
                      except:
                          pass
                  i = idx + 1

          with open(dylib_path, "wb") as f:
              f.write(data)

          print(f"[=] Dylib patches: {patched}")
          PYEOF

          echo "=== FilzaApplySandboxExt deps after patch ==="
          otool -L "$DYLIB" || true

      - name: Write entitlements
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
            <key>com.apple.private.MobileInstallation.AllowAllBundles</key>
            <true/>
            <key>com.apple.springboard.launchapplications</key>
            <true/>
            <key>get-task-allow</key>
            <true/>
            <key>application-identifier</key>
            <string>*</string>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Apply ldid entitlements
        run: |
          ldid -Sentitlements.plist "work/Payload/Filza.app/Filza"
          ldid -Sentitlements.plist "work/Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib"
          echo "ldid OK"

      - name: Remove old signature
        run: |
          rm -rf "work/Payload/Filza.app/_CodeSignature"
          rm -f  "work/Payload/Filza.app/embedded.mobileprovision"

      - name: Repack IPA
        run: |
          cd work && zip -qr ../Filza-iOS26-Fixed.ipa Payload/
          echo "IPA: $(du -sh ../Filza-iOS26-Fixed.ipa | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-iOS26-Fixed
          path: Filza-iOS26-Fixed.ipa
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "fixed-v4.0.1-${{ github.run_number }}"
          name: "Filza iOS 26 — Fixed (No Crash) Build ${{ github.run_number }}"
          body: |
            ## Filza iOS 26.2.1 — Crash Fix

            ### Çfarë u rregullua
            - `FilzaApplySandboxExt.dylib` mbetet (nevojitet për Apps Manager)
            - U konvertua nga `LC_LOAD_DYLIB` → `LC_LOAD_WEAK_DYLIB` (nuk crash-on nëse dështon)
            - `iosnhatt.dylib` dhe `libtelettt.dylib` → weak links brenda dylib-it
            - Entitlements të plota

            ### Instalim
            1. Shkarko `Filza-iOS26-Fixed.ipa`
            2. Hap me **ESign** → sinjalo
            3. Instalo dhe hap Filza → Apps Manager
          files: Filza-iOS26-Fixed.ipa
