name: Patch Filza IPA (Fix Apps Manager)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid

      - name: Extract IPA
        run: |
          mkdir -p work
          cp "Filza-Jailed-iOS26-Premium.ipa" work/Filza.zip
          cd work && unzip -q Filza.zip
          echo "Extracted: $(ls Payload/)"

      - name: Patch all binaries - weak link all dylibs (iOS 17-26.5)
        run: |
          python3 << 'PYEOF'
          import struct, os, glob

          LC_LOAD_DYLIB       = 0x0000000C
          LC_LOAD_WEAK_DYLIB  = 0x80000018
          FAT_MAGIC           = 0xCAFEBABE
          FAT_MAGIC_LE        = 0xBEBAFECA
          MH_MAGIC_64         = 0xFEEDFACF
          MH_CIGAM_64         = 0xCFFAEDFE

          def patch_macho_slice(data, base=0):
              patched = 0
              try:
                  magic = struct.unpack_from("<I", data, base)[0]
                  be = False
                  if magic == MH_CIGAM_64:
                      be = True
                  fmt = ">I" if be else "<I"
                  ncmds  = struct.unpack_from(fmt, data, base + 16)[0]
                  offset = base + 32  # mach header 64 size
                  for _ in range(ncmds):
                      cmd     = struct.unpack_from(fmt, data, offset)[0]
                      cmdsize = struct.unpack_from(fmt, data, offset + 4)[0]
                      if cmdsize == 0:
                          break
                      if cmd == LC_LOAD_DYLIB:
                          struct.pack_into(fmt, data, offset, LC_LOAD_WEAK_DYLIB)
                          dylib_off = struct.unpack_from(fmt, data, offset + 8)[0]
                          name_off = offset + dylib_off
                          name = data[name_off:name_off+80].split(b'\x00')[0].decode(errors='replace')
                          print(f"  [+] weak: {name}")
                          patched += 1
                      offset += cmdsize
              except Exception as e:
                  print(f"  [!] slice error: {e}")
              return patched

          def patch_binary(path):
              with open(path, "rb") as f:
                  data = bytearray(f.read())
              if len(data) < 8:
                  return
              magic = struct.unpack_from(">I", data, 0)[0]
              total = 0
              if magic == FAT_MAGIC:
                  nfat = struct.unpack_from(">I", data, 4)[0]
                  print(f"FAT binary ({nfat} slices): {path}")
                  for i in range(nfat):
                      off = struct.unpack_from(">I", data, 8 + i * 20)[0]
                      total += patch_macho_slice(data, off)
              else:
                  print(f"Thin binary: {path}")
                  total += patch_macho_slice(data, 0)
              with open(path, "wb") as f:
                  f.write(data)
              print(f"  => {total} load commands patched")

          app = "work/Payload/Filza.app"
          targets = []

          # Main binary
          targets.append(f"{app}/Filza")

          # All dylibs
          for root, dirs, files in os.walk(app):
              for fn in files:
                  fp = os.path.join(root, fn)
                  if fn.endswith(".dylib"):
                      targets.append(fp)

          for t in targets:
              if os.path.isfile(t):
                  patch_binary(t)
          PYEOF

      - name: Write maximum entitlements (iOS 17-26.5)
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
            <key>com.apple.private.MobileInstallation.AllowAllBundles</key>
            <true/>
            <key>com.apple.springboard.launchapplications</key>
            <true/>
            <key>com.apple.private.allow-explicit-graphics-priority</key>
            <true/>
            <key>com.apple.private.memorystatus.ios.allow-high-memory</key>
            <true/>
            <key>com.apple.private.iowatchdog.client-disable</key>
            <true/>
            <key>com.apple.private.network.socket-delegate</key>
            <true/>
            <key>com.apple.rootless.volume.VM</key>
            <true/>
            <key>com.apple.private.vnode.lowpri-io</key>
            <true/>
            <key>com.apple.private.cs.debugger</key>
            <true/>
            <key>get-task-allow</key>
            <true/>
            <key>task_for_pid-allow</key>
            <true/>
            <key>run-unsigned-code</key>
            <true/>
            <key>com.apple.system-task-ports</key>
            <true/>
            <key>application-identifier</key>
            <string>*</string>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
            </array>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>*</string>
            </array>
          </dict>
          </plist>
          EOF
          echo "Entitlements written"

      - name: Apply ldid to all binaries
        run: |
          app="work/Payload/Filza.app"

          ldid -Sentitlements.plist "$app/Filza"
          echo "[+] Main binary patched"

          find "$app" -name "*.dylib" | while read dylib; do
            ldid -Sentitlements.plist "$dylib" 2>/dev/null && echo "[+] $dylib" || echo "[!] skip: $dylib"
          done

      - name: Remove old signatures
        run: |
          rm -rf "work/Payload/Filza.app/_CodeSignature"
          rm -f  "work/Payload/Filza.app/embedded.mobileprovision"
          find "work/Payload/Filza.app" -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true

      - name: Repack IPA
        run: |
          cd work && zip -qr ../Filza-iOS17-26-MaxCompat.ipa Payload/
          echo "IPA: $(du -sh ../Filza-iOS17-26-MaxCompat.ipa | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-iOS17-26-MaxCompat
          path: Filza-iOS17-26-MaxCompat.ipa
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "maxcompat-v4.0.1-${{ github.run_number }}"
          name: "Filza iOS 17-26.5 — Max Compatibility Build ${{ github.run_number }}"
          body: |
            ## Filza File Manager — iOS 17 deri 26.5

            ### Çfarë u rregullua
            - Të gjitha dylib-at (FilzaApplySandboxExt, iosnhatt, libtelettt) → **weak load**
            - Nuk crash-on nëse ndonjë dylib mungon ose dështon
            - Entitlements maksimale për akses të plotë
            - Kompatibël me **iOS 17, 18, 26, 26.2.1, 26.5**

            ### Instalim
            1. Shkarko `Filza-iOS17-26-MaxCompat.ipa`
            2. Hap me **ESign** → sinjalo
            3. Instalo dhe hap Filza
          files: Filza-iOS17-26-MaxCompat.ipa
