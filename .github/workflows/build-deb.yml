name: Build Filza DEB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y binutils zip

      - name: Extract IPA
        run: |
          mkdir -p pkg/Applications
          unzip -q "Filza-Jailed-iOS26-Premium.ipa" -d ipa_extracted
          cp -R ipa_extracted/Payload/Filza.app pkg/Applications/
          echo "Filza.app ready: $(du -sh pkg/Applications/Filza.app | cut -f1)"

      - name: Create control file
        run: |
          cat > control << 'EOF'
          Package: com.tigisoftware.filza
          Name: Filza File Manager
          Version: 4.0.1-2
          Architecture: iphoneos-arm
          Description: Filza File Manager for iOS 17-26 (Premium, Jailed)
          Maintainer: TigiSoftware
          Author: TigiSoftware
          Section: Utilities
          Homepage: https://tigisoftware.com
          EOF

      - name: Build DEB
        run: |
          mkdir build
          echo "2.0" > build/debian-binary

          mkdir ctrl_tmp
          cp control ctrl_tmp/control
          tar -czf build/control.tar.gz -C ctrl_tmp .

          tar -czf build/data.tar.gz -C pkg .

          cd build
          ar r ../Filza-iOS26-Premium.deb debian-binary control.tar.gz data.tar.gz
          cd ..

          echo "Built: $(du -sh Filza-iOS26-Premium.deb | cut -f1)"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-iOS26-Premium-deb
          path: Filza-iOS26-Premium.deb
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.1-${{ github.run_number }}
          name: "Filza iOS 26 Premium — Build ${{ github.run_number }}"
          body: |
            ## Filza File Manager — iOS 17 / 18 / 26

            Ready-to-install `.deb` package.

            **Install:**
            - Drag into Filza / Sileo / Zebra
            - SSH: `dpkg -i Filza-iOS26-Premium.deb`
          files: Filza-iOS26-Premium.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
